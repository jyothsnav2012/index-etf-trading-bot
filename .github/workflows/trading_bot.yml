- name: Auto-Commit Trade Database, Memory and Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main || true
          git stash pop || true
          git add -A docs/ *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state and dashboard [skip ci]" && git push origin main)
